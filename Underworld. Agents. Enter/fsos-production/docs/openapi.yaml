openapi: 3.1.0
info:
  title: Freight Sovereign OS API
  version: 0.1.0
  description: Production seed API for compliance rules, demo matching, and settlement previews.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
  /v1/compliance/rules:
    get:
      summary: Compliance rule metadata
      responses:
        "200":
          description: Broker record fields and rule metadata
  /v1/demo/match:
    get:
      summary: Demo load-to-carrier match
      responses:
        "200":
          description: Match result
  /v1/demo/compliance:
    post:
      summary: Demo compliance decision
      responses:
        "200":
          description: Compliance decision
  /v1/demo/settlement:
    post:
      summary: Settlement preview
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gross_amount_usd:
                  type: string
                  example: "650"
                payment_mode:
                  type: string
                  enum: [direct_ach, stablecoin, escrow, quickpay_one_day, quickpay_two_day, factoring]
                prior_transactions:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Settlement preview

