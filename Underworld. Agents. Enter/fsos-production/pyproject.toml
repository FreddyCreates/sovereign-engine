[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-sovereign-os"
version = "0.1.0"
description = "Production core for Freight Sovereign OS: carrier compliance, load matching, direct settlement, and auditability."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Medina / FSOS" }]
license = { text = "Proprietary - internal production seed" }
keywords = ["trucking", "fmcsa", "logistics", "carrier", "shipper", "compliance", "freight"]
dependencies = []

[project.scripts]
fsos = "fsos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

