services:
  sovereign-books-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereign_books_api
    ports:
      - "8090:8090"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - SOVEREIGN_BOOKS_DB=/app/data/sovereign_books.db
      # Secrets are read from .env; nothing is baked into the image.
      - REVENUECAT_SECRET_API_KEY=${REVENUECAT_SECRET_API_KEY:-}
      - REVENUECAT_WEBHOOK_AUTH=${REVENUECAT_WEBHOOK_AUTH:-}
      - REVENUECAT_WEBHOOK_SECRET=${REVENUECAT_WEBHOOK_SECRET:-}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID:-}
      - PLAID_SECRET=${PLAID_SECRET:-}
    volumes:
      - books_data:/app/data
    restart: unless-stopped

volumes:
  books_data:
