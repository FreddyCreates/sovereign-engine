name               = "emailai-mesh"
main               = "worker.js"
compatibility_date = "2024-12-01"

[vars]
DESIGNATION    = "RSHIP-MESH-EMAIL-001"
WORKER_NAME    = "EMAILAI_MESH"
WORKER_LATIN   = "epistula"
WORKER_MEANING = "EmailAI Mesh — Sovereign Email Intelligence Layer"
VERSION        = "1.0.0"
DOMAIN         = "medinatechlabs.net"
PROTOCOL       = "EAP-1"

# ═══════════════════════════════════════════════════════════════════════════════
# EMAILAI MESH — Multi-Identity Communication Layer
# All inbound email → parse → classify → route → act → remember
# ═══════════════════════════════════════════════════════════════════════════════

# ── AI Binding — Classification and response generation ────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Fast inbox cache + message state ───────────────────────────
[[kv_namespaces]]
binding = "MESH_INBOX"
id = "emailai-mesh-inbox"
preview_id = "emailai-mesh-inbox-preview"

[[kv_namespaces]]
binding = "MESH_STATE"
id = "emailai-mesh-state"
preview_id = "emailai-mesh-state-preview"

# ── D1 Database — Message store, classifications, routing log ──────────────────
[[d1_databases]]
binding = "MESH_DB"
database_name = "emailai-mesh"
database_id = "emailai-mesh-db"

# ── Queues — Async processing ─────────────────────────────────────────────────
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "emailai-mesh-inbound"

[[queues.producers]]
binding = "REFLEX_QUEUE"
queue = "emailai-reflex-triggers"

[[queues.producers]]
binding = "ALERT_QUEUE"
queue = "emailai-alerts"

[[queues.producers]]
binding = "BRAIN_QUEUE"
queue = "emailai-brain-classify"

[[queues.consumers]]
queue = "emailai-mesh-inbound"
max_batch_size = 10
max_batch_timeout = 30

# ── R2 Bucket — Attachment archive ────────────────────────────────────────────
[[r2_buckets]]
binding = "ATTACHMENT_STORE"
bucket_name = "emailai-attachments"
preview_bucket_name = "emailai-attachments-preview"

# ── Vectorize — Semantic search over messages ──────────────────────────────────
[[vectorize]]
binding = "MESSAGE_VECTORS"
index_name = "emailai-message-vectors"

# ── Analytics Engine — Mesh telemetry ──────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "MESH_ANALYTICS"
dataset = "emailai_mesh_events"

# ── Service Bindings — Connect to other organs ─────────────────────────────────
[[services]]
binding = "GATE_NODE"
service = "gate-node"

[[services]]
binding = "NOVA"
service = "nova"

[[services]]
binding = "CEREBRUM"
service = "cerebrum"

