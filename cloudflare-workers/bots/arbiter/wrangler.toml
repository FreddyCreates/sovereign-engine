name               = "rship-arbiter"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: rship-arbiter.<account-subdomain>.workers.dev

# Required secrets:
#   SLACK_SIGNING_SECRET   — from api.slack.com/apps → Basic Information
#   SLACK_BOT_TOKEN        — Bot User OAuth Token (xoxb-...)
#
# Optional:
#   ARBITER_OPS_CHANNEL    — Channel ID to post workflow notifications (e.g. #rship-ops)

[vars]
DESIGNATION    = "RSHIP-BOT-ARB-001"
BOT_NAME       = "ARBITER"
BOT_LATIN      = "arbiter"
BOT_MEANING    = "Task Master · Workflow Judge · Orchestrator"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — Give ARBITER decision-making power
# ═══════════════════════════════════════════════════════════════════════════════

# ── Workers AI — Intelligent task routing ─────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Workflow state ─────────────────────────────────────────────
[[kv_namespaces]]
binding = "WORKFLOW_STATE"
id = "arbiter-workflow-state"
preview_id = "arbiter-workflow-state-preview"

# ── D1 Database — Task history ────────────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

# ── Queue — Task dispatch ─────────────────────────────────────────────────────
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "ai-analysis"
