name               = "rship-pulse"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: rship-pulse.<account-subdomain>.workers.dev

# Cron triggers — intelligence reports on schedule
[[triggers.crons]]
cron = "0 * * * *"     # Top of every hour — hourly pulse

[[triggers.crons]]
cron = "0 9 * * 1-5"   # 09:00 UTC Mon-Fri — market open briefing

[[triggers.crons]]
cron = "0 0 * * *"     # Midnight UTC daily — full intelligence digest

# Optional secrets:
#   PULSE_WEBHOOK_SLACK    — Slack incoming webhook for scheduled reports
#   PULSE_WEBHOOK_DISCORD  — Discord webhook

[vars]
DESIGNATION    = "RSHIP-BOT-PLS-001"
BOT_NAME       = "PULSE"
BOT_LATIN      = "pulsus"
BOT_MEANING    = "Heartbeat · Rhythm · Intelligence Signal"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — Give PULSE data awareness
# ═══════════════════════════════════════════════════════════════════════════════

# ── Workers AI — Report generation ────────────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Report cache ───────────────────────────────────────────────
[[kv_namespaces]]
binding = "REPORT_CACHE"
id = "pulse-report-cache"
preview_id = "pulse-report-cache-preview"

# ── D1 Database — Analytics data ──────────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

[[d1_databases]]
binding = "HONEYPOT_DB"
database_name = "medinatech-honeypot"
database_id = "medinatech-honeypot-db"

# ── Analytics Engine ──────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "PULSE_ANALYTICS"
dataset = "pulse_events"
