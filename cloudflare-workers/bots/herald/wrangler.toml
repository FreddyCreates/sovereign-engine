name               = "rship-herald"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: rship-herald.<account-subdomain>.workers.dev

# Set these as Worker Secrets (wrangler secret put SLACK_SIGNING_SECRET):
#   SLACK_SIGNING_SECRET   — from your Slack app settings
#   SLACK_BOT_TOKEN        — Bot User OAuth Token (xoxb-...)
#   RSHIP_NETWORK_URL      — base URL of your CEREBRUM instance

[vars]
DESIGNATION    = "RSHIP-BOT-HLD-001"
BOT_NAME       = "HERALD"
BOT_LATIN      = "heraldus"
BOT_MEANING    = "Messenger · Herald · Announcer"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — Give HERALD communication intelligence
# ═══════════════════════════════════════════════════════════════════════════════

# ── Workers AI — Smart message formatting ─────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Message history ────────────────────────────────────────────
[[kv_namespaces]]
binding = "MESSAGE_HISTORY"
id = "herald-message-history"
preview_id = "herald-message-history-preview"

# ── D1 Database — Core data ───────────────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

# ── Queue — Message dispatch ──────────────────────────────────────────────────
[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "ai-analysis"
