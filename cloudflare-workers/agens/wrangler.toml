name               = "agens"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: agens.<account-subdomain>.workers.dev
# Public domain will be set when assigned — add a [[routes]] block.

[vars]
DESIGNATION    = "RSHIP-AIS-AG-001"
WORKER_NAME    = "AGENS"
WORKER_LATIN   = "agens"
WORKER_MEANING = "The One Who Acts — Agent AI Services"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — Give AGENS brains, memory, and coordination
# ═══════════════════════════════════════════════════════════════════════════════

# ── Core agent logic is deterministic and self-contained (no external LLM) ───

# ── KV Namespace — Session and config storage ─────────────────────────────────
[[kv_namespaces]]
binding = "SESSION_STORE"
id = "agens-session-store"
preview_id = "agens-session-store-preview"

[[kv_namespaces]]
binding = "CONFIG_CACHE"
id = "agens-config-cache"
preview_id = "agens-config-cache-preview"

# ── D1 Database — Core data ───────────────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

# ── Queue — Async task processing ─────────────────────────────────────────────
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "ai-analysis"

# ── R2 Bucket — Asset storage ─────────────────────────────────────────────────
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "medinatech-assets"

# ── Vectorize — Knowledge retrieval ───────────────────────────────────────────
[[vectorize]]
binding = "KNOWLEDGE_INDEX"
index_name = "medinatech-knowledge"

# ── Analytics Engine ──────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "agens_events"
