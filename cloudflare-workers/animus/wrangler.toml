name               = "animus"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: animus.<account-subdomain>.workers.dev
# Public domain will be set when assigned — add a [[routes]] block.

[vars]
DESIGNATION    = "RSHIP-AIS-AN-001"
WORKER_NAME    = "ANIMUS"
WORKER_LATIN   = "animus"
WORKER_MEANING = "Soul — Mind — Spirit — Sovereign Intelligence Terminal"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — ANIMUS is the soul of the system
# ═══════════════════════════════════════════════════════════════════════════════

# ── Workers AI — Soul-level reasoning ─────────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Soul state persistence ─────────────────────────────────────
[[kv_namespaces]]
binding = "SOUL_STATE"
id = "animus-soul-state"
preview_id = "animus-soul-state-preview"

[[kv_namespaces]]
binding = "SESSION_STORE"
id = "animus-session-store"
preview_id = "animus-session-store-preview"

# ── D1 Database — Core and knowledge ──────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

[[d1_databases]]
binding = "KNOWLEDGE_DB"
database_name = "medinatech-knowledge"
database_id = "medinatech-knowledge-db"

# ── Queue — Async processing ──────────────────────────────────────────────────
[[queues.producers]]
binding = "SOUL_QUEUE"
queue = "ai-analysis"

# ── R2 Bucket — Asset storage ─────────────────────────────────────────────────
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "medinatech-assets"

# ── Vectorize — Semantic memory ───────────────────────────────────────────────
[[vectorize]]
binding = "MEMORY_VECTORS"
index_name = "medinatech-knowledge"

# ── Analytics Engine ──────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "SOUL_ANALYTICS"
dataset = "animus_events"
