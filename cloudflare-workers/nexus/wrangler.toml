name               = "nexus"
main               = "worker.js"
compatibility_date = "2024-09-02"
workers_dev     = true
# Private own-domain for now: nexus.<account-subdomain>.workers.dev
# Public domain will be set when assigned — add a [[routes]] block.

[vars]
DESIGNATION    = "RSHIP-AIS-NX-001"
WORKER_NAME    = "NEXUS"
WORKER_LATIN   = "nexus"
WORKER_MEANING = "Bond — Connection — Network"
VERSION        = "2.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# INTELLIGENT BINDINGS — NEXUS connects all workers
# ═══════════════════════════════════════════════════════════════════════════════

# ── Workers AI — Connection intelligence ──────────────────────────────────────
[ai]
binding = "AI"

# ── KV Namespace — Connection state ───────────────────────────────────────────
[[kv_namespaces]]
binding = "CONNECTION_STATE"
id = "nexus-connection-state"
preview_id = "nexus-connection-state-preview"

[[kv_namespaces]]
binding = "ROUTING_CACHE"
id = "nexus-routing-cache"
preview_id = "nexus-routing-cache-preview"

# ── D1 Database — Core data ───────────────────────────────────────────────────
[[d1_databases]]
binding = "CORE_DB"
database_name = "medinatech-core"
database_id = "medinatech-core-db"

# ── Queue — Inter-worker communication ────────────────────────────────────────
[[queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "ai-analysis"

# ── R2 Bucket — Shared assets ─────────────────────────────────────────────────
[[r2_buckets]]
binding = "SHARED_ASSETS"
bucket_name = "medinatech-assets"

# ── Analytics Engine ──────────────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "NEXUS_ANALYTICS"
dataset = "nexus_events"
