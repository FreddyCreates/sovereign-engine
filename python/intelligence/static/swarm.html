<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Swarm Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0.5rem 0;
            background: linear-gradient(135deg, #fff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .node-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .node-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .node-id {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent-blue);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 2s infinite;
        }

        .status-dot.computing {
            background-color: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple);
            animation: pulse-fast 0.5s infinite;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .controls {
            margin-top: 3rem;
            text-align: center;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }

        button {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: opacity 0.3s ease, transform 0.1s ease;
            margin: 0 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes pulse-fast {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>SOVEREIGN SWARM CONTROL</h1>
        <p style="color: var(--text-muted);">Real-time topology of the supercomputer mesh</p>
    </header>

    <div class="container">
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Nodes</div>
                <div class="stat-value" id="stat-nodes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Cluster Status</div>
                <div class="stat-value" style="font-size: 1.5rem; margin-top: 1.2rem; color: var(--accent-green);">ONLINE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Tasks Computed</div>
                <div class="stat-value" id="stat-tasks">0</div>
            </div>
        </div>

        <h2 style="font-weight: 300; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem;">Topology</h2>
        
        <div class="nodes-grid" id="nodes-container">
            <!-- Node cards injected here -->
        </div>

        <div class="controls">
            <h3 style="margin-top: 0;">Swarm Operations</h3>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Dispatch a heavy computational load to all connected C++ and Browser nodes.</p>
            <button id="btn-dispatch">DISPATCH KURAMOTO SIMULATION</button>
            <button id="btn-join" style="background: transparent; border: 1px solid var(--accent-green); color: var(--accent-green);">JOIN SWARM (BROWSER NODE)</button>
        </div>

    </div>

    <script>
        const API_BASE = window.location.origin;
        let browserNodeSocket = null;
        let isBrowserNode = false;

        // Poll topology every 1 second
        async function fetchTopology() {
            try {
                const res = await fetch(`${API_BASE}/api/swarm/topology`);
                const data = await res.json();
                
                document.getElementById('stat-nodes').innerText = data.nodes_connected;
                
                let totalTasks = 0;
                const container = document.getElementById('nodes-container');
                container.innerHTML = '';

                for (const [nodeId, metrics] of Object.entries(data.nodes)) {
                    totalTasks += metrics.tasks_completed;
                    
                    const card = document.createElement('div');
                    card.className = 'node-card';
                    card.innerHTML = `
                        <div class="node-header">
                            <span class="node-id">${nodeId}</span>
                            <div class="status-dot ${metrics.status === 'computing' ? 'computing' : ''}"></div>
                        </div>
                        <div class="metric">
                            <span style="color: var(--text-muted)">Type</span>
                            <span>${metrics.type}</span>
                        </div>
                        <div class="metric">
                            <span style="color: var(--text-muted)">Status</span>
                            <span style="color: ${metrics.status === 'computing' ? 'var(--accent-purple)' : 'var(--accent-green)'}">${metrics.status.toUpperCase()}</span>
                        </div>
                        <div class="metric">
                            <span style="color: var(--text-muted)">Tasks Completed</span>
                            <span>${metrics.tasks_completed}</span>
                        </div>
                    `;
                    container.appendChild(card);
                }

                document.getElementById('stat-tasks').innerText = totalTasks;

            } catch (err) {
                console.error("Failed to fetch topology:", err);
            }
        }

        setInterval(fetchTopology, 1000);
        fetchTopology();

        // Dispatch a task
        document.getElementById('btn-dispatch').addEventListener('click', async () => {
            try {
                await fetch(`${API_BASE}/api/swarm/dispatch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        task_type: "kuramoto_simulation",
                        payload: { iterations: 10000000, dt: 0.01 }
                    })
                });
                alert("Task broadcasted to the Swarm!");
            } catch (err) {
                alert("Failed to dispatch task.");
            }
        });

        // Browser Node Logic
        document.getElementById('btn-join').addEventListener('click', () => {
            if (isBrowserNode) {
                alert("Already connected as a browser node!");
                return;
            }

            const nodeId = 'WEB_NODE_' + Math.floor(Math.random() * 10000);
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            browserNodeSocket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/swarm/${nodeId}/browser`);

            browserNodeSocket.onopen = () => {
                isBrowserNode = true;
                document.getElementById('btn-join').innerText = "CONNECTED AS " + nodeId;
                document.getElementById('btn-join').style.background = "var(--accent-green)";
                document.getElementById('btn-join').style.color = "white";
            };

            browserNodeSocket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "task") {
                    console.log("Received task:", msg.data);
                    
                    // Tell master we are computing
                    browserNodeSocket.send(JSON.stringify({
                        type: "heartbeat",
                        status: "computing",
                        cpu_load: 100.0
                    }));

                    // Simulate heavy computation (non-blocking using setTimeout trick, or just blocking for a short bit)
                    setTimeout(() => {
                        let res = 0;
                        const iters = msg.data.payload.iterations || 1000000;
                        for(let i=0; i<iters; i++) {
                            res += Math.sin(1.618 * i);
                        }
                        
                        // Send result
                        browserNodeSocket.send(JSON.stringify({
                            type: "result",
                            task_id: msg.data.task_id,
                            result: res
                        }));
                    }, 100);
                }
            };

            browserNodeSocket.onclose = () => {
                isBrowserNode = false;
                document.getElementById('btn-join').innerText = "JOIN SWARM (BROWSER NODE)";
                document.getElementById('btn-join').style.background = "transparent";
                document.getElementById('btn-join').style.color = "var(--accent-green)";
            };
        });

    </script>
</body>
</html>
