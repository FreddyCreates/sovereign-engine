[package]
name = "capsula-icp-platform"
version = "0.1.0"
description = "CAPSULA memory-book platform for Internet Computer canisters"

[toolchain]
moc = "1.9.0"
lintoko = "0.10.0"

[dependencies]
core = "2.5.0"

[moc]
args = ["--default-persistent-actors", "-W=M0223,M0236,M0237"]

[canisters.backend]
main = "src/backend/main.mo"
candid = "src/backend/capsula.did"

[build]
outputDir = "src/backend/dist"
args = ["--release"]
