version: 1

networks:
  - name: local
    mode: managed
    gateway:
      port: 8000
  - name: ic
    providers:
      - https://ic0.app

environments:
  - name: local
    network: local
    canisters: [backend, frontend]
  - name: ic
    network: ic
    canisters: [backend, frontend]

canisters:
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.0.0"
      configuration:
        main: src/backend/main.mo
        candid: src/backend/capsula.did
  - name: frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: src/frontend/dist
        build:
          - npm install
          - npm run build --workspace src/frontend
