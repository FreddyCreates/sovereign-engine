name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node --check scripts/nervus-predeploy.mjs
      - run: node --check scripts/mainnet-gate.mjs
      - run: node --check scripts/validate-capsule.mjs
      - run: npm run validate:capsule
      - run: npm run check --workspace src/frontend
      - run: node scripts/nervus-predeploy.mjs
