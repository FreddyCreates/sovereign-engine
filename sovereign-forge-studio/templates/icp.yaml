# ── SOVEREIGN INFRASTRUCTURE PIPELINE MAP ──
version: 1
networks:
  - name: local
    mode: managed
    gateway:
      port: 8000
  - name: ic
    providers:
      - https://ic0.app

environments:
  - name: local
    network: local
    canisters: [sovereign_backend, sovereign_token, sovereign_frontend]
  - name: ic
    network: ic
    canisters: [sovereign_backend, sovereign_token, sovereign_frontend]

icp_capsula_manifest:
  route_id: "ROUTE-CAPSULA-ICP-INTELLIGENCE"
  doctrine: "VOXIS-SL-0-INVARIANT"
  engines:
    Ingestor:
      code: E1
      type: "Proposal Ingestor"
      cycle_period: 3600000
    Parser:
      code: E2
      type: "Payload Parser"
      wasm_hash: true
    Resolver:
      code: E3
      type: "Target Resolver"
    EffectBuilder:
      code: E4
      type: "Effect Path Builder"
      state_triple: "ANTE·MEDIUS·POST"
    TruthEngine:
      code: E5
      type: "Runtime Truth Engine"
      truth_ladder: 8
    RiskScorer:
      code: E6
      type: "Risk Scorer"
      weight_factor: 1.6180339
    PrecedentLinker:
      code: E7
      type: "Precedent Linker"
    Reviewer:
      code: E8
      type: "Reviewer Integration"
    VerifierPlan:
      code: E9
      type: "Verification Plan Builder"
    Watch:
      code: E10
      type: "Post-Execution Watch"
    AfterState:
      code: E11
      type: "After-State Verifier"
    MemoryField:
      code: E12
      type: "Memory Field Ticker"
      evaporation: 0.05
    Council:
      code: E13
      type: "Agent Council"
      agents: [ARCHON, VECTOR, LUMEN, FORGE]
    Alert:
      code: E14
      type: "Alert Engine"
    Exporter:
      code: E15
      type: "Dashboard State Updater"
