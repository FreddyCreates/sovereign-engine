name: Android release

# Builds a signed release bundle and, when Play credentials are configured,
# uploads it to the Google Play internal testing track.
#
# Required repository secrets for signing:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   REVENUECAT_GOOGLE_API_KEY public SDK key (goog_...)
# Optional, enables the Play upload step:
#   PLAY_SERVICE_ACCOUNT_JSON JSON key for a service account with release access
# Repository variable:
#   BOOKS_API_BASE_URL        production HTTPS URL of the books API

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      upload:
        description: Upload to Google Play (requires PLAY_SERVICE_ACCOUNT_JSON)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    # Secrets are only readable in job-level env, so the steps below test these.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Derive version code from the run number
        run: |
          echo "VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
          TAG="${GITHUB_REF_NAME#android-v}"
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"; fi

      - name: Build release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          BOOKS_API_BASE_URL: ${{ vars.BOOKS_API_BASE_URL }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Report signing state
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then echo "Bundle is signed with the upload key."; else echo "::warning::No keystore secret set; bundle is unsigned and cannot be uploaded to Play."; fi

      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-books-release-${{ env.VERSION_CODE }}
          path: |
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/mapping/release/mapping.txt

      - name: Attach bundle to the GitHub release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/bundle/release/*.aab
            android-app/app/build/outputs/apk/release/*.apk

      - name: Upload to Google Play
        if: ${{ env.PLAY_JSON != '' && env.KEYSTORE_B64 != '' && (github.event_name != 'workflow_dispatch' || inputs.upload) }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sovereignengine.books
          releaseFiles: android-app/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          mappingFile: android-app/app/build/outputs/mapping/release/mapping.txt
