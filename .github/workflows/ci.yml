name: CI

on:
  push:
    branches: [main, "feat/**", "claude/**"]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  android:
    name: Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; AGP installs any missing platform.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and unsigned release bundle
        env:
          REVENUECAT_GOOGLE_API_KEY: ${{ secrets.REVENUECAT_GOOGLE_API_KEY }}
          BOOKS_API_BASE_URL: ${{ vars.BOOKS_API_BASE_URL }}
        run: ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-outputs
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/bundle/release/*.aab

  screenshots:
    name: Screen renders
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render every screen with Roborazzi (JVM, no emulator)
        run: ./gradlew :app:recordRoborazziDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/play-store/screenshots/*.png

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
